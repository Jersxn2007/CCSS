<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Menu lateral: activo = inicio | proyectos | tareas -->
<aside class="app-sidebar" th:fragment="sidebar(activo)">

    <div class="logo">
		<h1>SkyFlow</h1>
    </div>

    <a class="nav-link-sf"
       th:classappend="${activo == 'inicio'} ? 'active'"
       th:href="@{/home}">
        <i class="bi bi-house-door"></i> Inicio
    </a>

    <a class="nav-link-sf"
       th:classappend="${activo == 'proyectos'} ? 'active'"
       th:href="@{/proyectos}">
        <i class="bi bi-folder2"></i> Proyectos
    </a>

    <a class="nav-link-sf"
       th:classappend="${activo == 'tareas'} ? 'active'"
       th:href="@{/tareas}">
        <i class="bi bi-check2-square"></i> Tareas
    </a>

</aside>

<!-- Barra superior: buscador + crear proyecto + cerrar sesion -->
<div class="topbar" th:fragment="topbar(placeholder)">
    <div class="buscador">
        <i class="bi bi-search"></i>
        <input type="text" id="buscador" class="form-control" th:placeholder="${placeholder}">
    </div>
    <div class="ms-auto d-flex gap-2">
        <a th:href="@{/proyectos/nuevo}" class="btn btn-outline-sf"><i class="bi bi-plus-lg"></i> Crear nuevo proyecto</a>
        <a th:href="@{/logout}" class="btn btn-outline-sf"><i class="bi bi-box-arrow-right"></i> Cerrar sesion</a>
    </div>
</div>

<!-- Mensajes flash (ok / error) -->
<div th:fragment="mensajes">
    <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
</div>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</th:block>

</body>
</html>
